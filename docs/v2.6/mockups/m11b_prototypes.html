<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qubit Quest M11B Prototypes</title>
<!--
  v2.6 M11B design prototypes. Static, isolated, dependency-free.
  Not part of lib/, the web build or any route. Open with ?s=<screen-id>,
  or with no query for the index. Content is real v2.6 content; every
  amplitude shown was computed for the circuit drawn.
-->
<style>
:root{
  /* Surfaces: proposed navy/charcoal ladder (see M11B_VISUAL_DESIGN.md §2) */
  --app:#05070C;          /* behind everything (was #00030A) */
  --nav:#0A0D14;          /* global navigation: charcoal */
  --section:#0B1220;      /* section navigation: deep navy */
  --page:#0D1526;         /* page header band */
  --work:#101A2C;         /* primary workspace */
  --work2:#0E1728;        /* secondary workspace */
  --inset:#070B14;        /* wells: circuit, maths, charts */
  --inspector:#131D31;    /* contextual inspector */
  --raised:#18233A;       /* raised controls (existing surfaceRaised) */
  --line:rgba(52,74,115,.40);
  --line-soft:rgba(52,74,115,.22);
  --text:#D6E3F8; --muted:#95A4BC; --faint:#6B7A93;
  --cyan:#56CCF2; --violet:#B388FF; --ok:#7CFFB2; --warn:#FFD54F; --err:#FF7A7A;
  --sel:rgba(34,211,238,.13);
  --r-ctl:10px; --r-card:12px; --r-panel:18px;
  --f:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --math:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--app);color:var(--text);font:14px/1.5 var(--f)}
a{color:var(--cyan);text-decoration:none}
button{font:inherit;color:inherit}
.math{font-family:var(--math);font-size:1.07em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.92em}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
.nocase{text-transform:none!important;letter-spacing:.02em!important}
.label{color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.hidden{display:none!important}

/* ---------- application shell ---------- */
.app{display:grid;grid-template-columns:var(--navw,232px) 1fr;height:100vh;overflow:hidden}
.gnav{background:var(--nav);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:18px 12px;gap:4px;min-width:0}
.logo{font-family:var(--math);font-size:21px;color:#fff;padding:2px 10px 18px;white-space:nowrap}
.logo small{display:none}
.gnav .grp{font-size:11px;letter-spacing:.1em;color:var(--violet);font-weight:700;margin:14px 10px 6px}
.gnav a.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--text);font-weight:500;white-space:nowrap}
.gnav a.item.on{background:var(--sel);color:var(--cyan)}
.gnav a.item i{width:22px;height:22px;flex:none;display:grid;place-items:center;font-style:normal;font-size:15px;border:1.5px solid currentColor;border-radius:6px;opacity:.85}
.gnav .foot{margin-top:auto;font-size:11.5px;color:var(--faint);padding:8px 10px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--app)}
.topbar{display:none}

/* page header band */
.phead{background:var(--page);border-bottom:1px solid var(--line-soft);padding:14px 28px 14px;display:flex;align-items:center;gap:18px;min-width:0}
.phead .crumb{font-size:12.5px;color:var(--muted)} .phead .crumb b{color:var(--cyan);font-weight:500}
.phead h1{font-size:21px;margin:2px 0 0;font-weight:600;line-height:1.25}
.phead .grow{flex:1;min-width:0}
.phead.compact{padding:8px 20px}
.phead.compact h1{font-size:16px;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--cyan);color:#041320;border-color:var(--cyan);font-weight:600}
.btn.quiet{border-color:transparent;color:var(--cyan);padding:7px 10px}
.btn.sm{padding:4px 12px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(124,255,178,.35)}
.chip.cur{color:var(--cyan);border-color:rgba(86,204,242,.45)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg span{padding:5px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg span.on{background:var(--raised);color:var(--text);font-weight:500}

.body{flex:1;min-height:0;display:flex;min-width:0}
.scroll{overflow:auto;min-height:0}

/* section navigation column (curriculum / index / challenge list) */
.secnav{width:var(--secw,300px);flex:none;background:var(--section);border-right:1px solid var(--line-soft);overflow:auto;padding:16px 12px}
.secnav h3{margin:4px 8px 10px;font-size:12px}
.secnav .row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;font-size:13.5px;min-width:0}
.secnav .row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secnav .row.on{background:var(--sel);color:var(--cyan)}
.secnav .row .n{color:var(--faint);font-size:12px;width:20px;text-align:right;flex:none}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:1.5px solid var(--faint)}
.dot.ok{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--section)}
.dot.cur{border-color:var(--cyan);background:radial-gradient(var(--cyan) 38%,transparent 42%)}
.secnav .sub{margin:2px 0 8px 30px;border-left:1px solid var(--line);padding-left:10px}
.secnav .sub .row{font-size:13px;padding:5px 8px}

/* ---------- Composer ---------- */
.composer{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.cbar{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--page);border-bottom:1px solid var(--line-soft);min-width:0;flex-wrap:wrap}
.cbar .title{font-weight:600;font-size:15px}
.cbar .sep{width:1px;height:20px;background:var(--line)}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.palette{display:flex;gap:18px;align-items:flex-end;padding:10px 18px;background:var(--work2);border-bottom:1px solid var(--line-soft);overflow-x:auto;min-width:0}
.palette .cat{display:flex;flex-direction:column;gap:6px;flex:none}
.palette .cat .label{font-size:10.5px}
.palette .tiles{display:flex;gap:6px}
.gt{min-width:40px;height:36px;padding:0 9px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.gt.dim{opacity:.38}
.g-X,.g-CX,.g-CCX,.g-MCX,.g-Rx{background:linear-gradient(#4A8DFF,#2F6FEA 55%,#2152B8)}
.g-Y,.g-CY,.g-Ry{background:linear-gradient(#62D8F6,#3FB8DD 55%,#2A8AB0)}
.g-H{background:linear-gradient(#FF6A63,#E44747 55%,#B53030)}
.g-X{background:linear-gradient(#4A8DFF,#2F6FEA 55%,#2152B8)}
.g-Y{background:linear-gradient(#62D8F6,#3FB8DD 55%,#2A8AB0)}
.g-Z{background:linear-gradient(#386EFF,#244ED2 55%,#1A3AA0)}
.g-S{background:linear-gradient(#8AA2FF,#6577E8 55%,#4C5BC0)}
.g-T,.g-Rz{background:linear-gradient(#B65CFF,#8E46E8 55%,#6C30BD)}
.g-CZ{background:linear-gradient(#4BCBFF,#3193E8 55%,#2356B8)}
.g-M{background:linear-gradient(#3A4660,#262F44);font-weight:600}
.cmain{flex:1;display:flex;min-height:0;min-width:0}
.ccol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.circuitwell{background:var(--inset);border-bottom:1px solid var(--line-soft);padding:14px 18px 10px;flex:none;overflow-x:auto}
.circuitwell .meta{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.analysis{padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.atabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.atabs span{padding:8px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.atabs span.on{color:var(--text);border-color:var(--cyan);font-weight:500}
.atabs .grow{flex:1}
.agrid{display:grid;grid-template-columns:repeat(var(--acols,3),minmax(0,1fr));gap:14px}
.panel{background:var(--work);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:14px 16px;min-width:0}
.panel h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.panel h4 .grow{flex:1}
.state{font-family:var(--math);font-size:19px;line-height:1.6;word-break:break-word}
.state b{color:var(--ok);font-weight:400}
table.amp{width:100%;border-collapse:collapse;font-size:13px}
table.amp td,table.amp th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line-soft)}
table.amp th{font-weight:500;color:var(--muted);font-size:11.5px}
.bar{height:8px;border-radius:4px;background:rgba(86,204,242,.12);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cyan);border-radius:4px}
.empty-note{font-size:12.5px;color:var(--faint)}

/* inspector */
.insp{width:var(--inspw,340px);flex:none;background:var(--inspector);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.insp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.insp-sec{padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.insp-sec .label{margin-bottom:6px;display:block}
.disc{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line-soft);font-weight:500;font-size:13.5px}
.disc::after{content:"▸";margin-left:auto;color:var(--muted)}
.disc.open::after{content:"▾"}
.insp-rail{width:44px;flex:none;background:var(--inspector);border-left:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:10px}
.insp-rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.mathwell{background:var(--inset);border-left:3px solid var(--violet);border-radius:8px;padding:10px 14px;font-family:var(--math);font-size:16px;overflow-x:auto}

/* lesson / challenge chrome */
.lesson{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.lhead{padding:18px 28px 14px;background:var(--page);border-bottom:1px solid var(--line-soft)}
.lhead .q{font-size:22px;font-weight:600;line-height:1.3;margin:4px 0 8px;max-width:70ch}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--work);border:1px solid var(--line-soft);border-left:3px solid var(--cyan);border-radius:10px;padding:10px 14px;max-width:110ch}
.task .label{color:var(--cyan);flex:none;padding-top:2px}
.ctx{margin-top:8px;font-size:13px;color:var(--cyan)}
.lesson>*{flex-shrink:0}
.lwork{flex:1 0 auto;display:flex;flex-direction:column}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.actionbar{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(13,21,38,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px);flex-wrap:wrap}
.actionbar .grow{flex:1}
.feedback{display:flex;gap:10px;align-items:center;font-size:13.5px}
.feedback .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--warn)}

/* reading surfaces */
.reading{flex:1;overflow:auto;min-width:0;background:var(--work2)}
.readwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,760px) minmax(0,1fr);gap:0 40px;padding:36px 40px 60px}
@media (min-width:1600px){.readwrap{grid-template-columns:minmax(0,1fr) minmax(0,760px) 250px minmax(0,1fr)}}
.article{grid-column:2;min-width:0}
.margin{grid-column:3;min-width:0;position:sticky;top:24px;align-self:start;font-size:13px;display:none}
@media (min-width:1600px){.margin{display:block}}
.article .eyebrow{color:var(--cyan);font-size:13px;font-weight:500}
.article h1{font-size:30px;margin:6px 0 6px;line-height:1.2}
.article .lede{font-size:17px;color:#E7EEFB;margin:0 0 24px;line-height:1.55}
.article h2{font-size:18px;margin:28px 0 8px;font-weight:600}
.article p{margin:0 0 12px;max-width:68ch;line-height:1.7;font-size:15px}
.figure{background:var(--work);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:14px 16px;margin:14px 0}
.margin .label{display:block;margin:0 0 8px}
.margin ul{list-style:none;padding:0;margin:0 0 22px}
.margin li{padding:4px 0 4px 10px;border-left:2px solid var(--line);color:var(--muted)}
.margin li.on{border-color:var(--cyan);color:var(--text)}
/* two-page spread */
.spreadwrap{padding:28px 36px 48px;display:flex;justify-content:center}
.book{display:grid;grid-template-columns:1fr 1fr;max-width:1480px;width:100%;background:#0F1829;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.page{padding:36px 44px 40px;min-width:0}
.page+.page{border-left:1px solid var(--line);background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 28px)}
.page .folio{font-size:11.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}

/* option cards */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--work);line-height:1.55}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.opt.sel{border-color:var(--cyan);background:rgba(86,204,242,.07)}
.opt.sel .k{background:var(--cyan);border-color:var(--cyan);color:#041320;font-weight:700}
.workbook{max-width:860px;margin:0 auto;padding:26px 28px 90px}

/* Bloch */
.bloch{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.bloch .act{grid-row:1/3;background:var(--work2);border-right:1px solid var(--line-soft);overflow:auto;padding:16px}
.bloch .stage{background:radial-gradient(ellipse at 50% 45%,#0F1C33,var(--inset) 70%);display:grid;place-items:center;position:relative;min-height:0;overflow:hidden}
.bloch .stage svg{max-height:calc(100% - 36px);width:auto;height:auto;max-width:100%}
.bloch .read{grid-row:1/3;grid-column:3;background:var(--inspector);border-left:1px solid var(--line-soft);overflow:auto}
.bloch .timeline{grid-column:2;background:var(--work);border-top:1px solid var(--line);padding:12px 18px}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;background:var(--work2);white-space:nowrap}
.step.on{border-color:var(--cyan);color:var(--cyan)}
.step.preview{border-style:dashed;border-color:var(--violet);color:var(--violet)}
.arrow{color:var(--faint)}
.transport{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tbtn{height:32px;min-width:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.tbtn.play{background:var(--cyan);color:#041320;border-color:var(--cyan);font-weight:600}

/* index page */
.index{max-width:1100px;margin:0 auto;padding:40px 24px}
.index h1{font-size:28px;margin:0 0 6px}
.index ol{columns:2;column-gap:40px;padding-left:20px}
.index li{margin:6px 0;break-inside:avoid}

/* ---------- responsive tiers (M11B_VISUAL_DESIGN.md §6) ---------- */
@media (min-width:1600px){ .agrid{--acols:3} }
@media (min-width:2000px){ .analysis{max-width:1760px} }
@media (max-width:1439px){
  .app{--navw:76px}
  .gnav{padding:14px 8px;align-items:center}
  .gnav .grp,.gnav a.item span,.gnav .foot{display:none}
  .gnav a.item{padding:10px;justify-content:center}
  .logo{font-size:0;padding:0 0 14px}.logo small{display:block;font-size:20px}
  .secnav{--secw:264px}
  .bloch{grid-template-columns:270px minmax(0,1fr) 310px}
}
@media (max-width:1279px){
  .agrid{--acols:2}
  .insp{position:absolute;right:0;top:0;bottom:0;box-shadow:-18px 0 40px rgba(0,0,0,.45);z-index:5}
  .cmain{position:relative}
  .book{grid-template-columns:1fr}.page+.page{border-left:0;border-top:1px solid var(--line);background:none}
  .bloch{grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(380px,1fr) auto auto}
  .bloch .read{grid-row:3;grid-column:1/3;border-left:0;border-top:1px solid var(--line-soft)}
  .bloch .act{grid-row:1/3}
  .secnav.collapsible{--secw:228px}
}
@media (max-width:1023px){
  .secnav.collapsible{display:none}
  .ctxstrip{display:flex!important}
  .compare{grid-template-columns:1fr}
  .phead,.lhead{padding-left:20px;padding-right:20px}
}
@media (max-width:899px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .gnav{display:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--nav);border-bottom:1px solid var(--line-soft)}
  .topbar .logo{font-size:19px;padding:0}.topbar .logo small{display:none}
  .secnav{display:none}
  .agrid{--acols:1}
  .readwrap{display:block;padding:22px 18px 50px}
  .bloch{display:flex;flex-direction:column;overflow:auto}
  .bloch>*{flex-shrink:0}
  .bloch .stage{min-height:340px;order:1}
  .bloch .act{order:2}
  .bloch .timeline{order:3}
  .bloch .read{order:4}
  .bloch .act,.bloch .read{border:0}
  .main .body{overflow:auto}
}
@media (max-width:599px){
  .palette{gap:12px;padding:8px 12px}
  .gt{min-width:36px;height:34px}
  .lhead .q{font-size:19px}
  .phead h1{font-size:18px}
  .hide-sm{display:none!important}
  .article h1{font-size:24px}
  .workbook{padding:18px 16px 90px}
  .cbar{padding:8px 12px}
  .analysis{padding:12px}
  .insp-rail{display:none}
  .insp{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;max-height:62vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.5)}
}
.ctxstrip{display:none;align-items:center;gap:10px;padding:8px 20px;background:var(--section);border-bottom:1px solid var(--line-soft);font-size:13px;overflow-x:auto;white-space:nowrap}
.ctxstrip .pip{width:22px;height:6px;border-radius:3px;background:var(--line)}
.ctxstrip .pip.ok{background:var(--ok)} .ctxstrip .pip.cur{background:var(--cyan)}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ======================= helpers ======================= */
const $=(h)=>h;
const S2='√2';
function gateTile(g,dim){return `<span class="gt g-${g.replace(/[^A-Za-z]/g,'')||'X'} ${dim?'dim':''}">${g}</span>`}

/* Circuit SVG. spec:{n, init:[...], cols:[[op...]], sel:{col,idx}, cell, fixed:Set "c:q"} */
function circuit(spec){
  const n=spec.n, cw=spec.cell||54, rh=spec.row||46, left=58, top=10;
  const cols=spec.cols.length, W=left+Math.max(cols+(spec.pad??2),4)*cw+10, H=top*2+n*rh;
  const y=q=>top+q*rh+rh/2, x=c=>left+c*cw+cw/2;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="circuit" style="display:block">`;
  s+=`<defs>
   <linearGradient id="gH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A63"/><stop offset=".55" stop-color="#E44747"/><stop offset="1" stop-color="#B53030"/></linearGradient>
   <linearGradient id="gX" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A8DFF"/><stop offset=".55" stop-color="#2F6FEA"/><stop offset="1" stop-color="#2152B8"/></linearGradient>
   <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D8F6"/><stop offset=".55" stop-color="#3FB8DD"/><stop offset="1" stop-color="#2A8AB0"/></linearGradient>
   <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8AA2FF"/><stop offset=".55" stop-color="#6577E8"/><stop offset="1" stop-color="#4C5BC0"/></linearGradient>
   <linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4660"/><stop offset="1" stop-color="#262F44"/></linearGradient>
  </defs>`;
  for(let q=0;q<n;q++){
    s+=`<text x="6" y="${y(q)-6}" fill="#95A4BC" font-size="11" font-family="Roboto">q${q}</text>`;
    s+=`<text x="6" y="${y(q)+12}" fill="#D6E3F8" font-size="15" font-family="Cambria Math,Georgia,serif">|${(spec.init||[])[q]??0}⟩</text>`;
    s+=`<line x1="${left-6}" x2="${W-8}" y1="${y(q)}" y2="${y(q)}" stroke="#3A4A66" stroke-width="1.4"/>`;
  }
  spec.cols.forEach((ops,c)=>ops.forEach((op,i)=>{
    const sel=spec.sel&&spec.sel.col===c&&spec.sel.idx===i;
    const fixed=op.fixed;
    if(op.c){ // controlled
      const qs=[...op.c,op.t], a=Math.min(...qs), b=Math.max(...qs);
      if(sel) s+=`<rect x="${x(c)-21}" y="${y(a)-22}" width="42" height="${y(b)-y(a)+44}" rx="12" fill="rgba(124,255,178,.06)" stroke="#7CFFB2" stroke-width="2"/>`;
      s+=`<line x1="${x(c)}" x2="${x(c)}" y1="${y(a)}" y2="${y(b)}" stroke="#4A8DFF" stroke-width="2.4"/>`;
      op.c.forEach(q=>s+=`<circle cx="${x(c)}" cy="${y(q)}" r="5.5" fill="#4A8DFF"/>`);
      if(op.g==='CY') s+=box(x(c),y(op.t),'Y','gY',sel,fixed);
      else s+=`<circle cx="${x(c)}" cy="${y(op.t)}" r="13" fill="url(#gX)"/><path d="M${x(c)-7} ${y(op.t)}h14M${x(c)} ${y(op.t)-7}v14" stroke="#fff" stroke-width="2.4"/>`+(fixed?lock(x(c)+12,y(op.t)-13):'');
      if(fixed&&op.g!=='CY') {}
    } else {
      const grad=op.g==='H'?'gH':op.g==='Y'?'gY':op.g==='S'?'gS':op.g==='M'?'gM':'gX';
      s+=box(x(c),y(op.q),op.g==='M'?'M':op.g,grad,sel,fixed);
    }
  }));
  if(spec.ghost!=null){const c=spec.cols.length;s+=`<rect x="${x(c)-19}" y="${top+6}" width="38" height="${n*rh-12}" rx="10" fill="none" stroke="#56CCF2" stroke-dasharray="4 4" opacity=".55"/><text x="${x(c)}" y="${H-2}" fill="#56CCF2" font-size="10" text-anchor="middle" opacity=".8">drop</text>`}
  return s+'</svg>';
  function box(cx,cy,t,grad,sel,fixed){
    return `${sel?`<rect x="${cx-22}" y="${cy-22}" width="44" height="44" rx="12" fill="none" stroke="#7CFFB2" stroke-width="2"/>`:''}<rect x="${cx-17}" y="${cy-17}" width="34" height="34" rx="9" fill="url(#${grad})" stroke="rgba(255,255,255,.14)"/><text x="${cx}" y="${cy+6}" fill="#fff" font-size="${t.length>1?13:17}" font-weight="700" text-anchor="middle" font-family="Roboto">${t}</text>${fixed?lock(cx+13,cy-15):''}`;
  }
  function lock(cx,cy){return `<circle cx="${cx}" cy="${cy}" r="6.5" fill="#0D1526" stroke="#95A4BC"/><rect x="${cx-2.6}" y="${cy-1}" width="5.2" height="4" fill="#D6E3F8"/><path d="M${cx-1.8} ${cy-1}v-1.6a1.8 1.8 0 0 1 3.6 0v1.6" stroke="#D6E3F8" fill="none" stroke-width="1"/>`}
}

/* probability bars: rows [{k,p,obs?}], showing exact outline vs observed fill */
function fmtPct(p){const v=p*100;return (Number.isInteger(v)?v.toFixed(0):String(+v.toFixed(3)))+'%'}
function probChart(rows,{obs=false,target=null}={}){
  return `<div style="display:flex;flex-direction:column;gap:7px">${rows.map(r=>`
   <div style="display:grid;grid-template-columns:62px 1fr 64px;gap:10px;align-items:center">
     <span class="math">|${r.k}⟩</span>
     <div style="position:relative;height:16px;background:rgba(86,204,242,.07);border-radius:4px">
       ${target!=null?`<i style="position:absolute;left:0;top:0;bottom:0;width:${(target[r.k]||0)*100}%;border:1.5px dashed #B388FF;border-radius:4px"></i>`:''}
       ${obs?`<i style="position:absolute;left:0;top:2px;bottom:2px;width:${r.obs*100}%;background:#56CCF2;border-radius:3px"></i>
              <i style="position:absolute;left:0;top:0;bottom:0;width:${r.p*100}%;border:1.5px solid #D6E3F8;border-radius:4px"></i>`
           :`<i style="position:absolute;left:0;top:2px;bottom:2px;width:${r.p*100}%;background:#56CCF2;border-radius:3px"></i>`}
     </div>
     <span class="num" style="text-align:right">${obs?(r.obs*100).toFixed(1)+'%':fmtPct(r.p)}</span>
   </div>`).join('')}</div>`;
}

/* Bloch sphere SVG: vec [x,y,z]; preview vec optional (dashed); arc optional */
function sphere(size,v,{preview=null,trail=[],label=''}={}){
  const R=size*0.38, cx=size/2, cy=size/2;
  // oblique projection: x toward viewer-left-down, y to the right, z up
  const P=([x,y,z])=>[cx + y*R - x*R*0.38, cy - z*R + x*R*0.30];
  const pt=(a)=>P(a).map(n=>n.toFixed(1)).join(',');
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="max-width:100%;height:auto">`;
  s+=`<defs><radialGradient id="sph" cx=".38" cy=".33" r=".75"><stop offset="0" stop-color="#1D3557" stop-opacity=".9"/><stop offset="1" stop-color="#07101F" stop-opacity=".3"/></radialGradient></defs>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#sph)" stroke="#56CCF2" stroke-opacity=".55"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${R*0.33}" fill="none" stroke="#56CCF2" stroke-opacity=".35"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${R*0.36}" ry="${R}" fill="none" stroke="#56CCF2" stroke-opacity=".18"/>`;
  [[[0,0,1.15],'z','|0⟩'],[[0,0,-1.15],'','|1⟩'],[[0,1.18,0],'y','|+i⟩'],[[1.45,0,0],'x','|+⟩'],[[-1.2,0,0],'','|−⟩'],[[0,-1.18,0],'','|−i⟩']].forEach(([a,ax,l])=>{
    s+=`<line x1="${cx}" y1="${cy}" x2="${P(a)[0]}" y2="${P(a)[1]}" stroke="#56CCF2" stroke-opacity=".28"/>`;
    s+=`<text x="${P(a)[0]+4}" y="${P(a)[1]-4}" fill="#95A4BC" font-size="${size>300?13:10}" font-family="Cambria Math,Georgia,serif">${l}</text>`;
  });
  if(trail.length>1){s+=`<polyline points="${trail.map(pt).join(' ')}" fill="none" stroke="#B388FF" stroke-opacity=".45" stroke-width="1.6"/>`}
  if(preview){
    // arc from v to preview (great-circle approximation)
    const arc=[];for(let t=0;t<=1.0001;t+=.05){const m=v.map((a,i)=>a*(1-t)+preview[i]*t),L=Math.hypot(...m)||1;arc.push(m.map(a=>a/L))}
    s+=`<polyline points="${arc.map(pt).join(' ')}" fill="none" stroke="#B388FF" stroke-width="2.4" stroke-dasharray="6 5"/>`;
    const [px,py]=P(preview);
    s+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#B388FF" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${px}" cy="${py}" r="${size>300?9:6}" fill="none" stroke="#B388FF" stroke-width="2.4"/>`;
  }
  const [vx,vy]=P(v);
  s+=`<line x1="${cx}" y1="${cy}" x2="${vx}" y2="${vy}" stroke="#D6E3F8" stroke-width="${size>300?3:2}"/><circle cx="${vx}" cy="${vy}" r="${size>300?10:6}" fill="#fff" stroke="#B388FF" stroke-width="3"/>`;
  if(label) s+=`<text x="${cx}" y="${size-6}" text-anchor="middle" fill="#95A4BC" font-size="12">${label}</text>`;
  return s+'</svg>';
}

       <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="btn primary sm">Apply Rx(π/2)</span><span class="btn sm">Cancel</span></div>
     </section>
     <div class="disc" style="padding:12px 0;border:0">About the Rx gate</div>
   </aside>
   <div class="stage">${sphere(520,plusi,{preview:zero,trail})}
     <div style="position:absolute;left:16px;top:12px;display:flex;gap:10px;font-size:12px;flex-wrap:wrap"><span><b style="color:#fff">●</b> Current state</span><span style="color:var(--violet)">◌ Preview: not applied yet</span><span class="muted">— Path so far</span></div>
     <div style="position:absolute;right:14px;top:10px;display:flex;gap:6px" class="hide-sm"><span class="btn sm">Drag vector</span><span class="btn sm">⤾ Reset view</span></div>
   </div>
   <div class="timeline" aria-label="State evolution">
     <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap"><span class="label">State evolution</span><span class="muted" style="font-size:12.5px">2 steps applied · showing the current state</span></div>
     <div class="steps"><span class="step">Start |0⟩</span><span class="arrow">→</span><span class="step">H · |+⟩</span><span class="arrow">→</span><span class="step on">S · |+i⟩</span><span class="arrow">⇢</span><span class="step preview">Rx(π/2) · preview</span></div>
     <div class="transport"><span class="tbtn" title="First step">⏮</span><span class="tbtn" title="Previous step">◀ Step</span><span class="tbtn play">▶ Play steps</span><span class="tbtn" title="Next step">Step ▶</span><span class="tbtn">Speed 1×</span><span style="flex:1"></span><span class="tbtn">↶ Undo</span><span class="tbtn">⟲ Reset to |0⟩</span><label class="tbtn"><input type="checkbox" checked style="margin:0"> Animate when applying</label></div>
   </div>
   <aside class="read" aria-label="Read">
     <div class="insp-sec"><span class="label">Current state</span><div class="state">|ψ⟩ = (1/√2)|0⟩ + (i/√2)|1⟩ = |+i⟩</div></div>
     <div class="insp-sec"><span class="label">Z-basis probabilities</span>${probChart([{k:'0',p:.5},{k:'1',p:.5}])}</div>
     <div class="disc open">Amplitudes</div>
     <div class="insp-sec"><table class="amp"><tr><td class="math">α</td><td class="math">1/√2</td><td class="num">0.7071</td></tr><tr><td class="math">β</td><td class="math">i/√2</td><td class="num">0.7071i</td></tr></table></div>
     <div class="disc">Bloch coordinates <span class="faint" style="font-weight:400;font-size:12px;margin-left:6px">x 0 · y 1 · z 0</span></div>
     <div class="disc">Angles <span class="faint" style="font-weight:400;font-size:12px;margin-left:6px">θ π/2 · φ π/2</span></div>
     <div class="disc">Phase <span class="faint" style="font-weight:400;font-size:12px;margin-left:6px">relative π/2</span></div>
     <div class="disc">Measure in a basis</div>
     <div class="insp-sec" style="border:0"><p class="faint" style="font-size:12px;margin:0">Single-qubit laboratory. A qubit entangled with others has no state vector of its own: its reduced state lies inside the sphere, and reduced states are not shown here.</p></div>
   </aside>
  </div>`);
}
