<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qubit Quest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MathJax Configuration - IMPORTANT: This must come BEFORE the MathJax script itself -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <!-- MathJax CDN for LaTeX rendering -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; /* Dark background similar to GitHub Dark */
            color: #c9d1d9; /* Light grey text */
            margin: 0;
            padding: 20px; /* Add some padding for better aesthetics in browser */
            min-height: 100vh; /* Ensure full height on load */
            display: flex; /* Re-added flex for centering the main container */
            justify-content: center;
            align-items: center;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #161b22;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
            border: 2px solid #161b22;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444c56;
        }
    </style>
</head>
<body>

    <!-- Main Content -->

        <nav class="mb-8">

                    <a href="./app-documentation.html" class="block w-full py-3 px-6 bg-[#0d1117] hover:bg-[#1f262c] text-[#c9d1d9] text-lg font-medium rounded-md transition-colors duration-200 ease-in-out border border-[#30363d] shadow-md">
                        App Documentation
                    </a>
                </li>
                <li>
                    <a href="./quantum-fundamentals.html" class="block w-full py-3 px-6 bg-[#0d1117] hover:bg-[#1f262c] text-[#c9d1d9] text-lg font-medium rounded-md transition-colors duration-200 ease-in-out border border-[#30363d] shadow-md">

                <li>

                        Privacy Policy
                    </a>
                </li>

        </nav>

        <div class="mb-8">
            <a href='https://play.google.com/store/apps/details?id=com.qubitquest&pcampaignid=pcampaignidMKT-Other-global-all-co-prtnr-py-PartBadge-Mar2515-1'
