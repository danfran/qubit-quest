name: Synchronize and Deploy Qubit Quest Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-pages-repository:
    if: github.repository == 'danfran/quantum-quiz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward destination repository
        env:
          QUBIT_QUEST_PAGES_TOKEN: ${{ secrets.QUBIT_QUEST_PAGES_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${QUBIT_QUEST_PAGES_TOKEN:-}" ]; then
            echo "::error::QUBIT_QUEST_PAGES_TOKEN is not configured."
            exit 1
          fi

          askpass="$RUNNER_TEMP/qubit-quest-git-askpass.sh"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$QUBIT_QUEST_PAGES_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT

          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          git remote add destination https://github.com/danfran/qubit-quest.git
          git fetch --no-tags destination main

          if ! git merge-base --is-ancestor destination/main HEAD; then
            echo "::error::danfran/qubit-quest main has diverged from source main. Reconcile the histories manually; no force-push was attempted."
            exit 1
          fi

          git push destination HEAD:refs/heads/main

  deploy-pages:
    if: github.repository == 'danfran/qubit-quest' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release --base-href /qubit-quest/
      - name: Include public mobile documentation
        run: cp -R docs/public/. build/web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
